services:
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ntro-network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.10.2
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - ntro-network

  neo4j:
    image: neo4j:5.12.0
    environment:
      - NEO4J_AUTH=neo4j/password
    ports:
      - "7474:7474" 
      - "7687:7687" 
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - ntro-network

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - SUPABASE_JWT_SECRET=your-supabase-jwt-secret-here
    networks:
      - ntro-network
    depends_on:
      - redis
      - elasticsearch
      - neo4j

volumes:
  redis_data:
  es_data:
  neo4j_data:
  neo4j_logs:

networks:
  ntro-network:
    driver: bridge