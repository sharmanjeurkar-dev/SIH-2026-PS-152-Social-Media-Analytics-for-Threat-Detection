services:
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    networks:
      - ntro-network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.10.2
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
    ports:
      - "9200:9200"
    networks:
      - ntro-network

  neo4j:
    image: neo4j:5.12.0
    environment:
      - NEO4J_AUTH=neo4j/password
    ports:
      - "7474:7474" 
      - "7687:7687" 
    networks:
      - ntro-network

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=ntro_admin
      - POSTGRES_PASSWORD=securepassword
      - POSTGRES_DB=ntro_auth
    ports:
      - "5432:5432"
    networks:
      - ntro-network

networks:
  ntro-network:
    driver: bridge